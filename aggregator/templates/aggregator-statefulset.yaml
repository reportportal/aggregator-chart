apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aggregator
  labels: {{ include "labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      component: reportportal-aggregator
  serviceName: aggregator
  template:
    metadata:
      labels:
        component: reportportal-aggregator
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      {{- if and .Values.nodeSelector.enabled .Values.nodeSelector.selector }}
      nodeSelector:
        {{- range $key, $value := .Values.nodeSelector.selector }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "%s-aggregator" .Release.Name) }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
      - env:
        - name: "PORT"
          value: "{{ .Values.service.port }}"
        # X (formerly Twitter) Configuration
        {{- if .Values.landing.x.secretName }}
        - name: "TWITTER_CONSUMER"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.x.secretName }}"
              key: "{{ .Values.landing.x.consumerKeyName }}"
        - name: "TWITTER_CONSUMER_SECRET"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.x.secretName }}"
              key: "{{ .Values.landing.x.consumerSecretKeyName }}"
        - name: "TWITTER_TOKEN"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.x.secretName }}"
              key: "{{ .Values.landing.x.tokenKeyName }}"
        - name: "TWITTER_TOKEN_SECRET"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.x.secretName }}"
              key: "{{ .Values.landing.x.tokenSecretKeyName }}"
        {{- else }}
        - name: "TWITTER_CONSUMER"
          value: {{ .Values.landing.x.consumer | quote }}
        - name: "TWITTER_CONSUMER_SECRET"
          value: {{ .Values.landing.x.consumerSecret | quote }}
        - name: "TWITTER_TOKEN"
          value: {{ .Values.landing.x.token | quote }}
        - name: "TWITTER_TOKEN_SECRET"
          value: {{ .Values.landing.x.tokenSecret | quote }}
        {{- end }}
        - name: "TWITTER_BUFFER_SIZE"
          value: {{ .Values.landing.x.bufferSize | quote }}
        {{- if .Values.landing.x.searchTerm }}
        - name: "TWITTER_SEARCH_TERM"
          value: {{ .Values.landing.x.searchTerm | quote }}
        {{- end }}
        # GitHub Configuration
        {{- if .Values.landing.github.secretName }}
        - name: "GITHUB_TOKEN"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.github.secretName }}"
              key: "{{ .Values.landing.github.tokenKeyName }}"
        {{- else }}
        {{- if .Values.landing.github.token }}
        - name: "GITHUB_TOKEN"
          value: {{ .Values.landing.github.token | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.landing.github.includeBeta }}
        - name: "GITHUB_INCLUDE_BETA"
          value: {{ .Values.landing.github.includeBeta | quote }}
        {{- end }}
        # YouTube Configuration
        {{- if .Values.landing.youtube.channelId }}
        - name: "YOUTUBE_CHANNEL_ID"
          value: {{ .Values.landing.youtube.channelId | quote }}
        {{- end }}
        - name: "YOUTUBE_BUFFER_SIZE"
          value: {{ .Values.landing.youtube.bufferSize | quote }}
        # Google API Configuration
        {{- if .Values.landing.google.secretName }}
        - name: "GOOGLE_API_KEY"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.google.secretName }}"
              key: "{{ .Values.landing.google.apiKeyKeyName }}"
        {{- else }}
        {{- if .Values.landing.google.apiKey }}
        - name: "GOOGLE_API_KEY"
          value: {{ .Values.landing.google.apiKey | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.landing.google.projectId }}
        - name: "GOOGLE_PROJECT_ID"
          value: {{ .Values.landing.google.projectId | quote }}
        {{- end }}
        {{- if or .Values.landing.google.secretName .Values.landing.google.recaptchaKey }}
        {{- if .Values.landing.google.secretName }}
        - name: "GOOGLE_RECAPTCHA_KEY"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.google.secretName }}"
              key: "{{ .Values.landing.google.recaptchaKeyKeyName }}"
        {{- else if .Values.landing.google.recaptchaKey }}
        - name: "GOOGLE_RECAPTCHA_KEY"
          value: {{ .Values.landing.google.recaptchaKey | quote }}
        {{- end }}
        {{- end }}
        - name: "GOOGLE_RECAPTCHA_SCORE"
          value: {{ .Values.landing.google.recaptchaScore | quote }}
        {{- if .Values.landing.google.applicationCredentials.credentialsSecretName }}
        - name: "GOOGLE_APPLICATION_CREDENTIALS"
          value: {{ .Values.landing.google.applicationCredentials.credentialsPath | default "/etc/google/credentials.json" | quote }}
        {{- end }}
        # Mailchimp Configuration
        {{- if .Values.landing.mailchimp.secretName }}
        - name: "MAILCHIMP_API_KEY"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.mailchimp.secretName }}"
              key: "{{ .Values.landing.mailchimp.apiKeyKeyName }}"
        {{- else }}
        {{- if .Values.landing.mailchimp.apiKey }}
        - name: "MAILCHIMP_API_KEY"
          value: {{ .Values.landing.mailchimp.apiKey | quote }}
        {{- end }}
        {{- end }}
        - name: "MAILCHIMP_USER"
          value: {{ .Values.landing.mailchimp.user | quote }}
        - name: "MAILCHIMP_TIMEOUT_SECONDS"
          value: {{ .Values.landing.mailchimp.timeoutSeconds | quote }}
        # Contentful Configuration
        {{- if .Values.landing.contentful.secretName }}
        - name: "CONTENTFUL_SPACE_ID"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.contentful.secretName }}"
              key: "{{ .Values.landing.contentful.spaceIdKeyName }}"
        - name: "CONTENTFUL_TOKEN"
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.landing.contentful.secretName }}"
              key: "{{ .Values.landing.contentful.tokenKeyName }}"
        {{- else }}
        {{- if .Values.landing.contentful.spaceId }}
        - name: "CONTENTFUL_SPACE_ID"
          value: {{ .Values.landing.contentful.spaceId | quote }}
        {{- end }}
        {{- if .Values.landing.contentful.token }}
        - name: "CONTENTFUL_TOKEN"
          value: {{ .Values.landing.contentful.token | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.image.registry }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        {{- else }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        {{- end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: aggregator
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.landing.google.applicationCredentials.credentialsSecretName }}
        volumeMounts:
        - name: google-credentials
          mountPath: {{ .Values.landing.google.applicationCredentials.credentialsMountPath | default "/etc/google" }}
          readOnly: true
        {{- end }}
      {{- if .Values.landing.google.applicationCredentials.credentialsSecretName }}
      volumes:
      - name: google-credentials
        secret:
          secretName: {{ .Values.landing.google.applicationCredentials.credentialsSecretName }}
          items:
          - key: {{ .Values.landing.google.applicationCredentials.credentialsKeyName }}
            path: credentials.json
      {{- end }}
